# Fly.io config for divepredictor.
# After `fly launch --no-deploy`, run:
#   fly volumes create divepredictor_data --size 1 --region sjc
# Then `fly deploy`.

app = "divepredictor"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DIVEPREDICTOR_DB = "/data/divepredictor.sqlite3"
  CANONICAL_HOST = "divepredictor.archisgore.com"
  REDIRECT_HOSTS = "divepredictor.fly.dev"

[[mounts]]
  source = "divepredictor_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
