# Fly.io config for divepredictor.
# After `fly launch --no-deploy`, run:
#   fly volumes create divepredictor_data --size 1 --region sjc
# Then `fly deploy`.

app = "divepredictor"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DIVEPREDICTOR_DB = "/data/divepredictor.sqlite3"
  CANONICAL_HOST = "divepredictor.archisgore.com"
  REDIRECT_HOSTS = "divepredictor.fly.dev"

[[mounts]]
  source = "divepredictor_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# Health check removed intentionally: with auto_stop_machines=stop and
# min_machines_running=0, an HTTP probe every 30s would keep the machine
# perpetually awake and defeat the cost-saving intent. Fly's default
# TCP-level liveness still covers crash detection.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
