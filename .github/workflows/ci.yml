name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - run: pip install -r python/requirements-dev.txt
      - run: python -m pytest -q python/tests
        env:
          DIVEPREDICTOR_LIVE: "1"
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t divepredictor python
